version: '3'

info:
  companyName: WinScript Doctor contributors
  productName: WinScript Doctor
  productIdentifier: dev.winscriptdoctor.desktop
  description: Windows 스크립트 실행 환경 진단
  version: 0.1.1

dev_mode:
  root_path: .
  log_level: warn
  debounce: 800
  ignore:
    dir: [.git, .local, node_modules, frontend, bin]
    file: ['*_test.go', '*.log']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 task build:dev
      type: blocking
    - cmd: npm --prefix frontend run dev
      type: background
      readiness:
        http: http://127.0.0.1:5173/
        timeout: 30s
        interval: 200ms
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
